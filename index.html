<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Khmer Letters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ruffle configuration -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      wasmPath: "ruffle.wasm"
    };
  </script>
  <!-- Load Ruffle -->
  <script src="ruffle.js"></script>
</head>
<body>
  <!-- SWF placeholder -->
  <object id="ruffle-object" data="Consonants.swf" type="application/x-shockwave-flash" width="800" height="600">
    <p>Your browser does not support Flash content.</p>
  </object>

  <script>
    // Helper to simulate mouse events
    function simulateMouseEvent(event, type, target) {
      const touch = event.changedTouches[0];
      const simulatedEvent = new MouseEvent(type, {
        bubbles: true,
        cancelable: true,
        view: window,
        detail: 1,
        screenX: touch.screenX,
        screenY: touch.screenY,
        clientX: touch.clientX,
        clientY: touch.clientY,
        button: 0
      });
      event.preventDefault();
      target.dispatchEvent(simulatedEvent);
    }

    window.addEventListener("load", () => {
      const observer = new MutationObserver(() => {
        const player = document.querySelector("ruffle-player");
        if (player) {
          // --- Hover + click emulation for drop-down menus ---
          player.addEventListener("touchstart", e => {
            simulateMouseEvent(e, "mouseover", player); // fake hover
            simulateMouseEvent(e, "mousedown", player);
          });
          player.addEventListener("touchend", e => {
            simulateMouseEvent(e, "mouseup", player);
          });
          player.addEventListener("touchmove", e => {
            simulateMouseEvent(e, "mousemove", player);
          });

          // --- Pinch to zoom emulation ---
          let lastDist = null;
          player.addEventListener("touchmove", e => {
            if (e.touches.length === 2) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (lastDist) {
                const delta = dist - lastDist;
                const wheelEvent = new WheelEvent("wheel", {
                  bubbles: true,
                  cancelable: true,
                  deltaY: -delta // negative = zoom in
                });
                player.dispatchEvent(wheelEvent);
              }
              lastDist = dist;
            }
          });
          player.addEventListener("touchend", () => { lastDist = null; });

          observer.disconnect(); // stop once we have the player
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
