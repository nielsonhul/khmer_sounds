<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Khmer Letters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ruffle configuration -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      wasmPath: "ruffle.wasm"
    };
  </script>
  <!-- Load Ruffle -->
  <script src="ruffle.js"></script>

  <style>
    /* Prevent browser from hijacking touch gestures */
    ruffle-player, ruffle-player canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- SWF placeholder -->
  <object id="ruffle-object" data="home.swf" type="application/x-shockwave-flash" width="800" height="600">
    <p>Your browser does not support Flash content.</p>
  </object>

  <script>
    function simulateMouseEvent(event, type, target) {
      const touch = event.changedTouches[0];
      const simulatedEvent = new MouseEvent(type, {
        bubbles: true,
        cancelable: true,
        clientX: touch.clientX,
        clientY: touch.clientY,
        button: 0
      });
      target.dispatchEvent(simulatedEvent);
    }

    window.addEventListener("load", () => {
      const observer = new MutationObserver(() => {
        const player = document.querySelector("ruffle-player");
        if (player && player.shadowRoot) {
          const canvas = player.shadowRoot.querySelector("canvas");
          if (canvas) {
            canvas.style.touchAction = "none";

            // --- Sticky hover logic ---
            let waitingForClick = false;

            canvas.addEventListener("touchstart", e => {
              e.preventDefault();
              if (!waitingForClick) {
                // First tap = hover (open menu)
                simulateMouseEvent(e, "mouseover", canvas);
                waitingForClick = true;
              } else {
                // Second tap = click (select item)
                simulateMouseEvent(e, "mousedown", canvas);
              }
            });

            canvas.addEventListener("touchend", e => {
              e.preventDefault();
              if (waitingForClick) {
                // Complete click action
                simulateMouseEvent(e, "mouseup", canvas);
                waitingForClick = false; // reset after click
              }
            });

            observer.disconnect();
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
