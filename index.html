<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Khmer Letters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ruffle configuration -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      wasmPath: "ruffle.wasm"
    };
  </script>
  <!-- Load Ruffle -->
  <script src="ruffle.js"></script>
</head>
<body>
  <!-- SWF placeholder -->
  <object id="ruffle-object" data="Consonants.swf" type="application/x-shockwave-flash" width="800" height="600">
    <p>Your browser does not support Flash content.</p>
  </object>

  <!-- Touch-to-mouse event conversion -->
  <script>
    function simulateMouseEvent(event, type, target) {
      const touch = event.changedTouches[0];
      const simulatedEvent = new MouseEvent(type, {
        bubbles: true,
        cancelable: true,
        view: window,
        detail: 1,
        screenX: touch.screenX,
        screenY: touch.screenY,
        clientX: touch.clientX,
        clientY: touch.clientY,
        button: 0
      });
      event.preventDefault();
      target.dispatchEvent(simulatedEvent);
    }

    // Wait until Ruffle injects the <ruffle-player>
    window.addEventListener("load", () => {
      const observer = new MutationObserver(() => {
        const player = document.querySelector("ruffle-player");
        if (player) {
          // Map touch → mouse
          player.addEventListener("touchstart", e => simulateMouseEvent(e, "mousedown", player));
          player.addEventListener("touchend",   e => simulateMouseEvent(e, "mouseup",   player));
          player.addEventListener("touchmove",  e => simulateMouseEvent(e, "mousemove", player));
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
